<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Embedded system block diagram with sensors, MCU, communication buses and robot">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f9ff"/></linearGradient><style>.tx{font-family:'Segoe UI',Arial,sans-serif;fill:#133a61}.line{fill:none;stroke:#0c9bec;stroke-width:4;stroke-dasharray:10 8;animation:shift 6s linear infinite}.bounce{animation:bounce 3s ease-in-out infinite}.blink{animation:fade 2s ease-in-out infinite}@keyframes shift{to{stroke-dashoffset:-180}}@keyframes bounce{50%{transform:translateY(-8px)}}@keyframes fade{50%{opacity:.3}}</style></defs>
<rect width="1100" height="340" rx="20" fill="url(#bg)" stroke="#d6ecfd"/>
